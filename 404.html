    <style>
        /* Two themes, both monochrome — black-and-white, no colour anywhere. Links carry no
           hue; the underline (below) is what marks them. */
        :root[data-theme="light"] {
            --bg: #ffffff;
            --text: #333;
            --text-muted: #666;
            --link: #111;
            --border: #ddd;
            --code-bg: #f5f5f5;
            --tag-bg: #eee;
            /* chrome ink: everything the living-ink field covers (headings, rules, nav,
               meta, pills) renders in this when the field isn't painting — so no-JS and
               no-GPU pages show the designed look with zero script involvement. */
            --chrome: #111111;
        }
        /* Light palette PER TIER (html.fc-gpu is set by field-chrome when the GPU tier
           boots): flat/no-JS users live with solid chrome ink forever, so they keep the
           classic strong pairing above. GPU users' chrome is the living texture — their
           flat values only flash at boot — so prose takes the near-black (the protagonist)
           and the chrome recedes to a soft grey. Dark mode is one palette for everyone:
           on black, halation does the separating (whites bloom; blacks don't). */
        :root[data-theme="light"].fc-gpu {
            --text: #111111;
            --chrome: #444444;
        }
        :root[data-theme="dark"] {

        /* Masthead hierarchy: the h1 gets the page's one rule; sections stand bare.
           Headings + rules are chrome — they carry the field when it paints.
           Weight 400 (not browser-default bold): size + the rule carry the hierarchy,
           the regular strokes keep the field texture calm instead of massive. */
        h1, h2, h3 { color: var(--chrome); padding-bottom: 10px; font-weight: 400; }
        h1 { border-bottom: 2px solid var(--chrome); }
        hr { border: none; height: 2px; background: var(--chrome); }
        a { color: var(--link); text-decoration: underline; }
        ul, ol { padding-left: 1.5rem; margin: 1rem 0; }
        li { margin: 0.5rem 0; }
        /* ul bullets: ONE rule renders the disc two ways — as ::before when no JS runs,
           and as a real .fc-bullet span once the field engine boots (html.fc-js). Same
           declarations => same box => identical pixels; the span exists so the GPU tier
           can MEASURE it like every other component instead of recomputing geometry.
           ol keeps native numbers, in chrome ink. */
        ul { list-style: none; }
        ul li { position: relative; }
        ul li::before, ul li .fc-bullet {
            content: ""; position: absolute; left: -0.85em; top: 0.61em;
            width: 0.38em; height: 0.38em; border-radius: 50%; background: var(--chrome);
        }
        html.fc-js ul li::before { content: none; }
        nav ul li::before, nav ul li .fc-bullet { content: none; display: none; }
        li::marker { color: var(--chrome); }
        nav ul { list-style: none; padding: 0; margin: 0; }

    <script>
        (function() {
            const COOKIE_NAME = 'preferred-theme';
            function getCookieDomain() {
                const host = window.location.hostname;
                return host.endsWith('.cafeine.dev') ? ';domain=.cafeine.dev' : '';
            }
            function getPreference() {
                const match = document.cookie.match(new RegExp('(^| )' + COOKIE_NAME + '=([^;]+)'));
                return match ? match[2] : 'default';
            }
            function setPreference(pref) {
                document.cookie = `${COOKIE_NAME}=${pref}${getCookieDomain()};path=/;max-age=31536000;SameSite=Lax`;
                applyTheme();
            }
            function getBrowserPreference() {
                return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            function getEffectiveTheme() {
                const pref = getPreference();
                return pref === 'default' ? getBrowserPreference() : pref;
            }
            function applyTheme() {
                document.documentElement.setAttribute('data-theme', getEffectiveTheme());
                updateToggleButton();
            }
            function cycleTheme() {
                setPreference(getEffectiveTheme() === 'light' ? 'dark' : 'light');
            }
            function updateToggleButton() {
                const btn = document.getElementById('theme-toggle');
                if (!btn) return;
                btn.textContent = getEffectiveTheme() === 'dark' ? '⏾' : '☀︎';
            }
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', applyTheme);
            } else {
                applyTheme();
            }
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
                if (getPreference() === 'default') applyTheme();
            });
            window.cycleTheme = cycleTheme;
        })();
    </script>

    <script>/*
 * field-gpu.js — the WebGPU tier of the living-ink chrome (see field-chrome.js, which
 * loads this when navigator.gpu exist, and falls back to basic colors when init returns false for any reason).
 *
 * Architecture:
 *   - One fixed, full-viewport, pointer-transparent <canvas> overlay. The real DOM text
 *     stays in place (made transparent, still selectable/SEO/a11y); box-type helpers
 *     (slabs, rules, rings, bullets) are made invisible. The shader paints their ink.
 *   - ALPHA ATLAS: a viewport-sized 2D canvas holding the union of every target's alpha —
 *     glyphs drawn per text-fragment rect (Range.getClientRects, the wave's technique, so
 *     kerning/wrapping are the browser's own), boxes drawn as geometry. Redrawn on
 *     scroll/resize/theme; uploaded as a texture.
 *   - FRAGMENT SHADER: per pixel — sample atlas alpha; if inked, evaluate domain-warped
 *     fBm at DOCUMENT coordinates (pixel + scroll uniform) with a TRUE TIME AXIS (3D
 *     noise sliced over t): the continuous a→b→c evolution SVG's feTurbulence can never
 *     do, replacing the crossfade-reseed contraption entirely. Palette = the exact
 *     zigzag tables from the SVG engine, as a WGSL function.
 *   - Document-anchored coords make the unified field a triviality: no clusters, no
 *     feOffset — continuity is just arithmetic.
 */
(function () {
  "use strict";

  var WGSL = `
struct U {
  scroll : vec2f,
  size   : vec2f,
  time   : f32,
  dark   : f32,
  dpr    : f32,
  pad1   : f32,
};
@group(0) @binding(0) var<uniform> u : U;
@group(0) @binding(1) var atlasTex : texture_2d<f32>;
@group(0) @binding(2) var smp : sampler;

fn hash3(p : vec3f) -> f32 {
  var q = fract(p * 0.3183099 + vec3f(0.1, 0.2, 0.3));
  q = q * 17.0;
  return fract(q.x * q.y * q.z * (q.x + q.y + q.z));
}
fn vnoise(p : vec3f) -> f32 {
  let i = floor(p);
  let f = fract(p);
  let w = f * f * (3.0 - 2.0 * f);

    <script>/*
 * spa-nav.js — persistent-chrome navigation. Progressive enhancement only.
 *
 * Same-origin link clicks are intercepted: the target page (plain static HTML — the
 * build output IS the wire format, no JSON twin to drift) is fetched, parsed with
 * DOMParser, and only #content is swapped, plus the head nodes tagged data-page-css
 * (per-article fonts). Everything else — nav, theme scripts, and above all the GPU
 * field (canvas, device, clock) — persists, so navigation never reboots the field.
 *
 * Swaps are deliberately INSTANT: no transition animation — the living field is the
 * site's only motion. What makes the instant swap safe to look at is staging: the
 * target page's fonts are imported and awaited BEFORE the swap (stageFonts), and the
 * field atlas is redrawn synchronously inside it (field-gpu refresh), so the switch
 * is one complete frame — the click-time equivalent of the first-load curtain.
 *
 * Reading positions are recorded per pathname in sessionStorage (see the recorder
 * below) and restored on back/forward.
 *
 * Every unexpected shape falls back to a real navigation: modified clicks, other
 * origins, downloads, fetch errors, a page without #content. Without JS none of this
 * exists and links are just links. (All three runtime scripts, this one included, are
 * INLINED by base.html — no external JS, so engine/page version skew cannot exist.)
 */

  if (!window.fetch || !window.DOMParser || !history.pushState) return;
  if (window.__spaNav) return;
  window.__spaNav = true;

  var MAX_CACHE = 40;
  var renderedPath = location.pathname;

    var url;

    if (url.origin !== location.origin) return null;
    return url;

    try { y = parseInt(sessionStorage.getItem("fc-scroll:" + url.pathname), 10) || 0; } catch (e) {}
    swapLock = true;
    fetchPage(url).then(function (text) {
      return stagedSwap(parser.parseFromString(text, "text/html"), function () {
        renderedPath = url.pathname;

      swapLock = false;
      if (!ok) { location.reload(); return; }
    }).catch(function () { location.reload(); });
  });
})();
