<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transcript</title>
  <style>
    :root {
      --bg: #1b1b1b; --panel: #232323; --fg: #e8e6e3; --dim: #8a8884;
      --user: #c9c7c4; --claude: #d97757; --tool: #6ccc7a; --border: #3a3a3a;
      --mono: "JetBrains Mono","Fira Code",Menlo,Consolas,monospace;
      --sans: -apple-system,Segoe UI,Roboto,sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); }
    header {
      position: sticky; top: 0; background: var(--panel); border-bottom: 1px solid var(--border);
      padding: 0.7em 1.1em; display: flex; align-items: baseline; gap: 0.8em; z-index: 2;
    }
    header h1 { font-size: 1rem; margin: 0; font-weight: 700; }
    header .counts { font-size: 0.78rem; color: var(--dim); }
    header .note { margin-left: auto; font-size: 0.72rem; color: var(--dim); font-style: italic; }
    main { max-width: 60em; margin: 0 auto; padding: 1.2em 1.1em 4em; }
    .turn { margin: 0 0 1.2em; }
    .role { font-size: 0.7rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--dim); margin-bottom: 0.3em; }
    .user .bubble {
      background: var(--panel); border-left: 3px solid var(--user);
      padding: 0.6em 0.9em; border-radius: 0 6px 6px 0;
      white-space: pre-wrap; word-break: break-word;
    }
    .assistant .item { margin: 0 0 0.5em; white-space: pre-wrap; word-break: break-word; }
    .assistant .text { }
    .assistant .thinking { color: var(--dim); font-style: italic; border-left: 2px solid var(--border); padding-left: 0.7em; }
    .assistant .tool {
      font-family: var(--mono); font-size: 0.85em; color: var(--tool);
    }
    .assistant .tool .arg { color: var(--dim); }
    .assistant details.tool { white-space: normal; }
    .assistant details.tool > summary { cursor: pointer; list-style: none; }
    .assistant details.tool > summary::-webkit-details-marker { display: none; }
    .assistant details.tool > summary .toggle {
      color: var(--dim); font-size: 0.85em; margin-left: 0.6em;
      border: 1px solid var(--border); border-radius: 4px; padding: 0 0.4em;
    }
    .assistant details.tool[open] > summary .toggle::after { content: "masquer"; }
    .assistant details.tool:not([open]) > summary .toggle::after { content: "afficher"; }
    .assistant .edit { margin: 0.4em 0 0.2em 1.2em; font-size: 0.95em; }
    .assistant .edit .file { color: var(--dim); margin-bottom: 0.3em; }
    .assistant .edit pre {
      margin: 0 0 0.4em; padding: 0.5em 0.7em; border-radius: 4px; overflow-x: auto;
      white-space: pre; color: var(--fg); border-left: 3px solid var(--border);
    }
    .assistant .edit pre.old { background: #2e1f1f; border-left-color: #c05a5a; }
    .assistant .edit pre.new { background: #1f2e22; border-left-color: #5ab070; }
    .assistant .edit .lbl { font-size: 0.75em; color: var(--dim); text-transform: uppercase; letter-spacing: 0.06em; }
    .assistant .role::before { content: "\25CF  "; color: var(--claude); }
    .empty { color: var(--dim); text-align: center; margin-top: 4em; }
    a { color: var(--claude); }
  </style>
</head>
<body>
  <header>
    <h1 id="title">Transcript</h1>
    <span class="counts" id="counts"></span>
    <span class="note" id="note"></span>
  </header>
  <main id="main"><p class="empty" id="status">Chargement…</p></main>

  <script>
    // ?t=<file> — restricted to a safe filename in this directory.
    function transcriptFile() {
      const t = new URLSearchParams(location.search).get("t") || "transcript.json";
      return /^[\w.-]+\.json$/.test(t) ? t : "transcript.json";
    }
    function el(tag, cls, text) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text != null) e.textContent = text;
      return e;
    }
    function renderEdit(edit) {
      const box = el("div", "edit");
      if (edit.file) box.appendChild(el("div", "file", edit.file));
      const pair = (old, nw) => {
        if (old != null) { box.appendChild(el("div", "lbl", "avant")); box.appendChild(el("pre", "old", old)); }
        if (nw != null) { box.appendChild(el("div", "lbl", old != null ? "après" : "contenu")); box.appendChild(el("pre", "new", nw)); }
      };
      if (Array.isArray(edit.edits)) edit.edits.forEach(e => pair(e.old, e.new));
      else pair(edit.old, edit.new);
      return box;
    }
    function render(data) {
      document.getElementById("title").textContent = data.meta?.title || "Transcript";
      const m = data.meta || {};
      document.getElementById("counts").textContent =
        `${m.user_turns ?? "?"} prompts · ${m.assistant_turns ?? "?"} réponses`;
      if (m.note) document.getElementById("note").textContent = m.note;
      const main = document.getElementById("main");
      main.innerHTML = "";
      for (const turn of data.turns || []) {
        const t = el("div", "turn " + turn.role);
        if (turn.role === "user") {
          t.appendChild(el("div", "role", "vous"));
          t.appendChild(el("div", "bubble", turn.text));
        } else {
          t.appendChild(el("div", "role", "claude"));
          for (const item of turn.items || []) {
            if (item.t === "tool" && item.edit) {
              // Full edit content, collapsed by default; click the line to toggle.
              const d = el("details", "item tool");
              const sum = el("summary");
              sum.appendChild(el("span", null, item.name));
              if (item.target) { sum.appendChild(document.createTextNode(" ")); sum.appendChild(el("span", "arg", "(" + item.target + ")")); }
              sum.appendChild(el("span", "toggle"));
              d.appendChild(sum);
              d.appendChild(renderEdit(item.edit));
              t.appendChild(d);
            } else if (item.t === "tool") {
              const d = el("div", "item tool");
              d.appendChild(el("span", null, item.name));
              if (item.target) { d.appendChild(document.createTextNode(" ")); d.appendChild(el("span", "arg", "(" + item.target + ")")); }
              t.appendChild(d);
            } else {
              t.appendChild(el("div", "item " + (item.t === "thinking" ? "thinking" : "text"), item.text));
            }
          }
        }
        main.appendChild(t);
      }
      if (!(data.turns || []).length)
        main.appendChild(el("p", "empty", "Transcript vide."));
    }
    // cache: "no-store" — a re-exported transcript must show up on the next open,
    // not after the browser feels like revalidating.
    fetch(transcriptFile(), { cache: "no-store" })
      .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(render)
      .catch(e => {
        document.getElementById("status").textContent =
          "Impossible de charger le transcript (" + e.message + "). Servez le repo via HTTP, pas file://.";
      });
  </script>
</body>
</html>
